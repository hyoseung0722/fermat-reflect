<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페르마의 원리와 빛의 반사 시뮬레이터</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #1a252c;
            margin-bottom: 8px;
            font-size: 1.3rem;
            text-align: center;
        }
        p.subtitle {
            color: #6c757d;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-align: center;
        }
        .container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            box-sizing: border-box;
        }
        canvas {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background-color: #ffffff;
            touch-action: none;
            max-width: 100%;
            height: auto;
        }
        .info-panel {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
            justify-content: space-between;
        }
        .card {
            background: #f1f3f5;
            padding: 8px 5px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
        }
        .card .title {
            font-size: 11px;
            color: #495057;
            margin-bottom: 4px;
        }
        .card .value {
            font-size: 16px;
            font-weight: bold;
            color: #228be6;
        }
        .explanation {
            margin-top: 15px;
            padding: 12px;
            background-color: #e7f5ff;
            border-left: 4px solid #339af0;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.5;
            color: #1864ab;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>페르마의 원리와 빛의 반사 시뮬레이터</h1>
        <p class="subtitle">마우스나 손가락으로 거울 위를 드래그하여 최단 거리 지점을 찾아보세요.</p>
        
        <canvas id="simCanvas" width="700" height="400"></canvas>

        <div class="info-panel">
            <div class="card">
                <div class="title">입사각 (θ₁)</div>
                <div class="value" id="incidentAngle">0.0°</div>
            </div>
            <div class="card">
                <div class="title">반사각 (θ₂)</div>
                <div class="value" id="reflectedAngle">0.0°</div>
            </div>
            <div class="card">
                <div class="title">이동 거리 (L)</div>
                <div class="value" id="totalDistance" style="color: #12b886;">0 px</div>
            </div>
        </div>

        <div class="explanation">
            <strong>💡 탐구 핵심 원리:</strong><br>
            빛은 이동 시간이 최소가 되는(최단 거리) 경로를 따릅니다. 
            도착점 B의 대칭점 B'를 만들었을 때 A에서 B'까지 일직선이 되는 지점에서 <strong>입사각(θ₁)과 반사각(θ₂)이 같아지고 이동 거리가 최소</strong>가 됩니다.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const mirrorY = 280;
        const pointA = { x: 150, y: 100 };
        const pointB = { x: 550, y: 100 };
        
        // 반사점 P의 시작 위치를 거울 맨 왼쪽(x: 60)으로 설정
        let pointP = { x: 60, y: mirrorY };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 거울 그리기
            ctx.beginPath();
            ctx.moveTo(50, mirrorY);
            ctx.lineTo(650, mirrorY);
            ctx.strokeStyle = '#495057';
            ctx.lineWidth = 4;
            ctx.stroke();

            for (let x = 50; x <= 650; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, mirrorY);
                ctx.lineTo(x - 10, mirrorY + 12);
                ctx.strokeStyle = '#adb5bd';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            ctx.fillStyle = '#495057';
            ctx.font = '14px sans-serif';
            ctx.fillText("평면 거울 (Mirror)", 50, mirrorY + 30);

            const pointBPrime = { x: pointB.x, y: mirrorY + (mirrorY - pointB.y) };

            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.moveTo(pointB.x, pointB.y);
            ctx.lineTo(pointBPrime.x, pointBPrime.y);
            ctx.strokeStyle = '#ced4da';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]);

            // 법선
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(pointP.x, mirrorY - 150);
            ctx.lineTo(pointP.x, mirrorY);
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#ff6b6b';
            ctx.font = '12px sans-serif';
            ctx.fillText("법선 (Normal)", pointP.x - 35, mirrorY - 160);

            // 광선
            ctx.beginPath();
            ctx.moveTo(pointA.x, pointA.y);
            ctx.lineTo(pointP.x, pointP.y);
            ctx.lineTo(pointB.x, pointB.y);
            ctx.strokeStyle = '#228be6';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.setLineDash([3, 3]);
            ctx.moveTo(pointP.x, pointP.y);
            ctx.lineTo(pointBPrime.x, pointBPrime.y);
            ctx.strokeStyle = '#74c0fc';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            drawPoint(pointA.x, pointA.y, 'A (광원)', '#1c7ed6');
            drawPoint(pointB.x, pointB.y, 'B (도착점)', '#1c7ed6');
            drawPoint(pointP.x, pointP.y, 'P (반사점)', '#fcc419');
            drawPoint(pointBPrime.x, pointBPrime.y, "B' (대칭점)", '#adb5bd');

            const dx1 = pointP.x - pointA.x;
            const dy1 = mirrorY - pointA.y;
            const incidentAngleDeg = Math.abs(Math.atan2(dx1, dy1) * (180 / Math.PI));

            const dx2 = pointB.x - pointP.x;
            const dy2 = mirrorY - pointB.y;
            const reflectedAngleDeg = Math.abs(Math.atan2(dx2, dy2) * (180 / Math.PI));

            const dist1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
            const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
            const totalDist = Math.round(dist1 + dist2);

            document.getElementById('incidentAngle').innerText = incidentAngleDeg.toFixed(1) + '°';
            document.getElementById('reflectedAngle').innerText = reflectedAngleDeg.toFixed(1) + '°';
            document.getElementById('totalDistance').innerText = totalDist + ' px';
        }

        function drawPoint(x, y, label, color) {
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(label, x - 20, y - 12);
        }

        function updatePosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (clientX - rect.left) * scaleX;
            
            if (mouseX >= 60 && mouseX <= 640) {
                pointP.x = mouseX;
                draw();
            }
        }

        // PC 마우스
        canvas.addEventListener('mousemove', (e) => updatePosition(e.clientX));

        // 모바일 터치 지원
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) updatePosition(e.touches[0].clientX);
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updatePosition(e.touches[0].clientX);
        }, { passive: true });

        draw();
    </script>
</body>
</html>
